<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>keyrove keydown benchmark</title>
    <style>
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 1rem;
      }
      #fixture {
        height: 12rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <p>
      Times <code>keyRove</code> on generated pages. Run
      <code>pnpm bench</code> in <code>packages/keyrove</code> for headless
      Chrome, or build the package and press Run here to measure another
      browser.
    </p>
    <button id="run" type="button">Run</button>
    <pre id="results"></pre>
    <div id="fixture"></div>
    <script type="module">
      import { runBench } from './keydown.js';

      document.getElementById('run').addEventListener('click', async () => {
        const out = document.getElementById('results');
        out.textContent = 'Running…';
        const results = await runBench();
        out.textContent = results.cases
          .map(
            ({ section, label, fixture, result, median, p10, p90 }) =>
              `${section.padEnd(11)} ${fixture.name.padEnd(7)} ${label.padEnd(40)} ${result.padEnd(15)} ${median.toFixed(2).padStart(9)} µs  (p10 ${p10.toFixed(2)}, p90 ${p90.toFixed(2)})`,
          )
          .join('\n');
      });
    </script>
  </body>
</html>
