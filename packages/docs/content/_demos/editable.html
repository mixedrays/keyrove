<ul id="settings">
  <li data-keyrove-item tabindex="0">
    <label>
      <input type="checkbox" checked />
      Email notifications
    </label>
  </li>
  <li data-keyrove-item tabindex="0">
    <label>
      Display name
      <input type="text" value="Ada" />
    </label>
  </li>
  <li data-keyrove-item tabindex="0">
    <label>
      Font size
      <input type="range" min="12" max="24" value="16" />
    </label>
  </li>
  <li data-keyrove-item tabindex="0">
    <label>
      <input type="checkbox" />
      Weekly digest
    </label>
  </li>
  <li data-keyrove-item tabindex="0">
    <label>
      Signature
      <textarea rows="2" placeholder="Arrows move the caret here"></textarea>
    </label>
  </li>
</ul>
