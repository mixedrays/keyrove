<div id="workspace">
  <section
    data-keyrove-item
    data-keyrove-focus-key="ctrl+shift+Digit1"
    tabindex="0"
  >
    Explorer
  </section>
  <section
    data-keyrove-item
    data-keyrove-focus-key="ctrl+shift+Digit2"
    tabindex="0"
  >
    Editor
    <textarea
      rows="2"
      placeholder="Type here, then press Ctrl+Shift+1"
    ></textarea>
  </section>
  <section
    data-keyrove-item
    data-keyrove-focus-key="ctrl+shift+Digit3"
    tabindex="0"
  >
    Terminal
  </section>
</div>
