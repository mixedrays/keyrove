<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Filled in per page by vite-plugin-docs.ts. Vite builds this file once —
         bundling the entry and hashing the assets — and every page in
         content/ is then stamped out of the result, so all of them share one
         set of asset URLs. -->
    <!--page-head-->
    <!-- Linked here rather than imported from main.ts so that the stylesheet is
         render-blocking in dev too. Imported from JS, Vite injects it at runtime
         and every navigation paints unstyled markup first; the production build
         hoists it to a <link> either way, so only dev showed the flash. -->
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Restores an explicit theme choice before the first paint. Inline and
         render-blocking on purpose: deferring to main.ts would show a frame of
         the system theme first. No stored value means "follow the system", which
         style.css already handles, so there is nothing to set. -->
    <script>
      try {
        const stored = localStorage.getItem('keyrove-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        // Storage can be unavailable (Safari private mode); the system theme stands.
      }
    </script>
  </head>
  <body>
    <!--page-body-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
