<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Filled in per page by vite-plugin-docs.ts. Vite builds this file once —
         bundling the entry and hashing the assets — and every page in
         content/ is then stamped out of the result, so all of them share one
         set of asset URLs. -->
    <!--page-head-->
    <!-- Restores an explicit theme choice before the first paint. Inline and
         render-blocking on purpose: deferring to main.ts would show a frame of
         the system theme first. No stored value means "follow the system", which
         style.css already handles, so there is nothing to set. -->
    <script>
      try {
        const stored = localStorage.getItem('keyrove-theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {
        // Storage can be unavailable (Safari private mode); the system theme stands.
      }
    </script>
    <!-- Every navigation is a full page load, and the sidebar invites a lot of
         them. This prerenders a page once the pointer settles on its link, so
         the click lands on a document that is already parsed and painted.
         `moderate` is the hover trigger; Chrome caps how many run at once, and
         a browser with no speculation rules ignores the block.

         The .md twins and llms.txt are excluded. Both are served as text/plain
         to be read rather than navigated to, so prerendering one would spend
         the budget on a page nobody lands on. -->
    <script type="speculationrules">
      {
        "prerender": [
          {
            "where": {
              "and": [
                { "href_matches": "/*" },
                { "not": { "href_matches": "/*.md" } },
                { "not": { "href_matches": "/*.txt" } }
              ]
            },
            "eagerness": "moderate"
          }
        ]
      }
    </script>
    <!-- The page's stylesheet, filled in per page by vite-plugin-docs.ts:
         style-with-demos.css if the page embeds a demo, style.css if not.

         Linked from the markup rather than imported from main.ts so that it is
         render-blocking in dev too — imported from JS, Vite injects it at
         runtime and every navigation paints unstyled markup first.

         Last in the head, after the inline scripts: a script behind a pending
         stylesheet waits for it to download before it runs. -->
    <!--page-styles-->
  </head>
  <body>
    <!--page-body-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
