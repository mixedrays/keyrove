name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The browser suite drives headless Chromium, which Playwright installs
      # apart from the npm package.
      - run: pnpm --filter @mixedrays/keyrove exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:browser
      - run: pnpm build
