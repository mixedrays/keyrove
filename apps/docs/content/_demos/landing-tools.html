<div
  id="tools"
  role="toolbar"
  aria-orientation="vertical"
  aria-label="Drawing tools"
>
  <button
    data-keyrove-item
    data-keyrove-roving-tabindex
    data-keyrove-focus-key="KeyV"
    aria-keyshortcuts="V"
    tabindex="0"
  >
    Move
  </button>
  <button
    data-keyrove-item
    data-keyrove-roving-tabindex
    data-keyrove-focus-key="KeyR"
    aria-keyshortcuts="R"
    tabindex="-1"
  >
    Rectangle
  </button>
  <!-- fold -->
  <button
    data-keyrove-item
    data-keyrove-roving-tabindex
    data-keyrove-focus-key="KeyO"
    aria-keyshortcuts="O"
    tabindex="-1"
  >
    Ellipse
  </button>
  <button
    data-keyrove-item
    data-keyrove-roving-tabindex
    data-keyrove-focus-key="KeyP"
    aria-keyshortcuts="P"
    tabindex="-1"
  >
    Pen
  </button>
  <!-- /fold -->
  <button
    data-keyrove-item
    data-keyrove-roving-tabindex
    data-keyrove-focus-key="KeyT"
    aria-keyshortcuts="T"
    tabindex="-1"
  >
    Text
  </button>
</div>
